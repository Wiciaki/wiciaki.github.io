- title: グラフィック画像認識のためのソフトウェアシステムの開発と研究
  publishedIn:
    name: 国民教育委員会大学(クラクフ)
    date: 2024-09-26
  paper:
    summary: 本論文は、人工ニューラルネットワーク、特にホップフィールドネットワークとART-1ネットワークを用いたグラフィック画像認識システムの開発を扱っています。目的は、パターン認識の精度を向上させるためにこれらのネットワークを設計・実装することでした。両アーキテクチャを実装して徹底的にテストし、グラフィックパターンの復元能力や、ニューロン数とネットワーク容量に応じた性能を分析しました。ホップフィールドネットワークは高速な収束を示した一方、より複雑なデータセットでは精度に限界がありました。ART-1ネットワークは高い容量により多数のカテゴリを生成する可能性を示しましたが、精度は低く、さらなる最適化の必要性が明らかになりました。本研究は、これらのネットワークのグラフィック解析タスクにおける効率と適用性を高めるために、ビジランスなどのパラメータに関する継続的な研究と改善が必要であることを示しています。
  categories: ["compsci"]
  tags: ["人工ニューラルネットワーク", "パターン認識", "ホップフィールドネットワーク", "ART-1ネットワーク", "Python"]

- title: 仮想現実における視覚知覚のための隠れた物体の識別
  publishedIn:
    name: ヤギェウォ大学リポジトリ
    date: 2023-09-17
    url: https://ruj.uj.edu.pl/xmlui/handle/item/319836
  paper:
    summary: 仮想現実(VR)は極めて急速に発展している技術分野であり、私たちの知覚や世界の捉え方に大きな影響を与えています。しかし、VRにおいて視覚知覚から隠れた物体を識別することは、より深い理解と研究を必要とする課題のままです。本研究の目的は、仮想現実における視覚知覚のプロセスと、この環境で隠れている、あるいは検出が難しい物体の識別に関する知見を体系化することです。本研究は、仮想環境で物体を検出する能力に影響する要因を特定し、さまざまな可視化手法が隠れた物体の知覚に与える影響を評価するために実施した実験に基づいています。その結果、VR利用時における視覚刺激の重要な役割が示されました。被験者は、課題の難易度はバランスが取れており、音刺激によって障害物の位置を正確に特定できたと回答した一方で、仮想空間でのナビゲーションにはフラストレーションと負担を感じていました。
  categories: ["cognisci"]
  tags: ["仮想現実", "視覚知覚", "実験研究"]

- title: 製品の原産国情報が在ポーランド外国人の購買意思決定に与える影響
  publishedIn:
    name: ヤギェウォ大学リポジトリ
    date: 2022-07-15
    url: https://ruj.uj.edu.pl/xmlui/handle/item/297499
  paper:
    summary: 本研究の目的は、製品の原産国効果に関する知見を体系化し、ポーランドに居住する外国人の特定グループの購買意思決定に対して、製品の原産国の重要性がどのような影響を与えるかを明らかにすることでした。第1章では、消費者の購買意思決定とその決定要因を特徴付けています。第2章では、購買意思決定に影響を与える要因としての原産国効果に関する概念を説明しています。第3章では、製品の原産国に関する情報がポーランド在住の外国人の購買意思決定にどのように影響するかについて実施した調査の結果と分析を提示しています。本研究では記述的方法に加え、アンケート調査と独自調査の方法を用いました。各章の内容は、ポーランド語および英語の関連文献、学術論文、インターネット上で入手可能な資料に基づいています。
  categories: ["management"]
  tags: ["原産国効果", "購買意思決定", "在ポーランド外国人"]

- title: アルゴリズミック・ステートマシンを表すフローチャートの最適化
  publishedIn:
    name: AGHリポジトリ
    date: 2022-05-18
  paper:
    summary: 本研究の目的は、アルゴリズミック・ステートマシンの操作頂点を最小化する可能性を探ることです。著者は、これらのマシンの既存の種類と、古典的手法をはじめとするさまざまな最適化手法、および最適化を行うことの利点を提示しています。条件頂点を最適化するいくつかのシンプルな手法を組み合わせた解決策を提案し、それに基づいてC#言語でこの理論を実装するソフトウェアを開発しました。このソフトウェアは、フローチャートを作成してテキスト形式にコンパイルする人気ソフトASMCreatorのファイルを扱えるように設計されています。プログラムの動作は著者の多数のケースでテストされ、安定して信頼できるものと思われますが、あらゆるフローチャートに対して最適な結果を生成するという保証はありません。一部の例では、条件頂点最小化アルゴリズムが未実装であるために実現されていない最小化が見られます。このアルゴリズムのアイデアは本論文では十分に探究されていません。
  categories: ["compsci"]
  tags: ["C#", "アルゴリズミック・ステートマシン"]
