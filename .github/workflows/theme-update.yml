name: "Theme Update"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Update theme to latest release
        run: mise run update

      - name: Build
        run: |
          hugo --minify
          # drop the build output so it does not end up in the PR
          rm -rf public/

      # This PR is opened with the default GITHUB_TOKEN, which by design does
      # not trigger any further workflow. Its checks therefore never run and it
      # cannot satisfy the checks required on main, so merge it yourself using
      # the admin override after looking the diff over.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          title: Update theme
          commit-message: "chore(theme): update toha to the latest release"
          branch: chore/theme-update
          delete-branch: true
          labels: theme
