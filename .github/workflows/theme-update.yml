name: "Theme Update"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      # A PR opened with the default GITHUB_TOKEN does not trigger any further
      # workflow, so its checks never run and it can never satisfy the checks
      # required on main. A GitHub App token lifts that restriction. Without
      # the app configured the job still works, it just opens a PR for you to
      # look at by hand instead of merging it itself.
      - name: Generate app token
        id: app-token
        if: vars.THEME_BOT_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.THEME_BOT_APP_ID }}
          private-key: ${{ secrets.THEME_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      - name: Update theme to latest release
        run: mise run update

      - name: Build
        run: |
          hugo --minify
          # drop the build output so it does not end up in the PR
          rm -rf public/

      - name: Create Pull Request
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          base: main
          title: Update theme
          commit-message: "chore(theme): update toha to the latest release"
          branch: chore/theme-update
          delete-branch: true
          labels: theme

      # Only worth queueing when the checks can actually run, otherwise the PR
      # would sit waiting for a status that never arrives.
      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != '' && steps.app-token.outputs.token != ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
