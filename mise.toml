[tools]
# Hugo 0.170 dropped the extended edition and its built-in LibSass, so the
# theme's SCSS is now compiled by Dart Sass, which Hugo looks up on PATH.
# Installed from the GitHub release with the glibc build pinned: the aqua
# registry entry always picks the musl build on Linux, and that binary does
# not start on the Ubuntu runners.
hugo = 'latest'
"github:sass/dart-sass" = { version = 'latest', libc = 'glibc' }
node = 'latest'
go = 'latest'

[tasks.install]
description = "Install dependencies"
run = ["hugo mod tidy", "hugo mod npm pack", "npm install"]

[tasks.build]
description = "Build Hugo site"
depends = ["install"]
run = "hugo --gc --minify"

[tasks.server]
description = "Run hugo server"
depends = "install"
run = "hugo server -w"

[tasks.update]
description = "Update the theme to latest release"
run = "hugo mod get -u"
depends_post = "install"

[tasks.update-to-main]
description = "Update the theme to main branch"
run = "hugo mod get github.com/hugo-toha/toha/v4@main"
depends_post = "install"

[tasks.fix-security]
description = "Run npm audit fix"
run = "npm audit fix --force"
